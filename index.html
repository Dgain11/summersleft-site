<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summers Left</title>
<meta name="description" content="See exactly how many summers and weekends are left with each of your kids, and get one small idea for this weekend.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<style>
  .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .hero img { width: 128px; height: 128px; border-radius: 28px; margin: 0 auto 28px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .hero h1 { font-size: 40px; margin-bottom: 14px; }
  .lede { color: var(--muted); font-size: 19px; max-width: 30em; margin: 0 auto 28px; }
  .soon { display: inline-block; margin: 0 auto; padding: 10px 20px; border-radius: 999px;
          background: var(--sun); color: #2B2233; font-weight: 700; }
  .hero footer { margin-top: 40px; }
</style>
</head>
<body>
<main class="hero">
  <img src="icon.png" alt="Summers Left app icon">
  <h1>You get about 18 summers with your kids.</h1>
  <p class="lede">Summers Left shows exactly how many summers and weekends are left with each child, and gives you one small idea to make this weekend count.</p>
  <p><span class="soon">Coming soon to the App Store</span></p>
  <footer><a href="privacy/">Privacy Policy</a> · <a href="support/">Support</a></footer>
</main>
</body>
</html>
